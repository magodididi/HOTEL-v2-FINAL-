
services:
  backend:
    build:
      context: /Users/margarita/IdeaProjects/hotelbooking-v2
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      POSTGRES_DB: bd_hostels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network

  frontend:
    build:
      context: /Users/margarita/WebstormProjects/hotel-booking
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bd_hostels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network

networks:
  app-network:
